name: Atualizar Vitrine SoundCloud

on:
  schedule:
    - cron: '0 12 * * *' # Roda todo dia ao meio-dia
  workflow_dispatch:

jobs:
  update-json:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Instalar Python e Dependências
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install soundcloud
      
      - name: Gerar JSON da Vitrine
        run: python gerar_vitrine.py
        
      - name: Salvar alterações no repositório
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add vitrine.json
          git commit -m "update: novos lançamentos na vitrine" || exit 0
          git push
